name: Kaggle on-demand worker

# Wake-on-demand fallback. Every 5 minutes, ask the dashboard "is there
# work pending that no worker is going to pick up?" If yes, push the
# Kaggle worker notebook so Kaggle spins up a session. The notebook
# self-terminates after ~25 min of idle.
#
# CPU by default since 2026-08-20 — see the long note on the push step.
# Short version: no local models run on Kaggle any more, so a GPU
# session spends the scarce 30 GPU-hr/week budget on an accelerator
# nothing uses. CPU sessions draw on a separate, far larger quota. The
# GPU path is unchanged and one dispatch input away.

on:
  schedule:
    # Every 5 min as a safety net. Vercel POST /api/jobs ALSO triggers
    # this workflow directly via the GitHub Actions API when a job is
    # queued with no live GPU worker, so the user usually doesn't wait
    # this long — see web/app/api/jobs/route.ts:_maybeWakeKaggle.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      accelerator:
        description: >-
          Accelerator for this run. Blank = CPU kernel (the default).
          Pass NvidiaTeslaT4 to get a GPU back.
        required: false
        default: ""

concurrency:
  group: kaggle-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask Vercel if a worker is needed (cron path)
        id: probe
        # Manual workflow_dispatch (fired by Vercel POST /api/jobs)
        # ALREADY decided we need Kaggle — skip the probe in that case so
        # we don't false-negative on a stale backends doc or a queued job
        # whose backend_instance_id was set by a failed HF dispatch.
        if: github.event_name != 'workflow_dispatch'
        env:
          DASHBOARD_BASE: ${{ vars.DASHBOARD_BASE_URL }}
          VERCEL_BASE:    ${{ vars.VERCEL_BASE_URL }}
          API_KEY:        ${{ secrets.RENDER_TRIGGER_KEY }}
        run: |
          set -e
          # Prefer DASHBOARD_BASE_URL (Coolify); fall back to VERCEL_BASE_URL
          # (legacy). Either var works.
          BASE="${DASHBOARD_BASE:-$VERCEL_BASE}"
          if [ -z "$BASE" ]; then
            echo "::error::Set DASHBOARD_BASE_URL (or VERCEL_BASE_URL) repo variable to your dashboard URL."
            exit 1
          fi
          if [ -z "$API_KEY" ]; then
            echo "::error::RENDER_TRIGGER_KEY repo secret is required."
            exit 1
          fi
          body=$(curl -sS \
            -H "X-API-Key: ${API_KEY}" \
            "${BASE}/api/maintenance/needs-worker")
          echo "Response: $body"
          needs=$(echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if d.get('needs_worker') else 'false')")
          echo "needs_worker=$needs" >> "$GITHUB_OUTPUT"

      - name: Note (manual trigger always pushes to Kaggle)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Manual workflow_dispatch — skipping probe, pushing kernel directly."
          echo "needs_worker=true" >> "$GITHUB_OUTPUT"
        id: manual_trigger

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_worker == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_worker == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        if: github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_worker == 'true'
        # Pinned to 2.2.3+ — earlier versions don't expose the
        # --accelerator flag, which means every workflow-triggered
        # wake silently reset the notebook's accelerator to P100 (Kaggle
        # default). P100 is sm_6.0 which modern PyTorch dropped kernels
        # for → Kokoro, editor_gpu, and local_sdxl all fail with
        # cudaErrorNoKernelImageForDevice. Not fun.
        run: pip install --quiet 'kaggle>=2.2.3'

      - name: Push Kaggle worker kernel
        if: github.event_name == 'workflow_dispatch' || steps.probe.outputs.needs_worker == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -e
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error::KAGGLE_USERNAME and KAGGLE_KEY repo secrets are required (see kaggle/README.md)"
            exit 1
          fi
          # DEATH-SPIRAL GUARD. Kaggle notebook boot takes 5-8 min.
          # A `kaggle kernels push` CANCELS the currently-running run.
          # This cron fires every 5 min. Without this check: boot starts
          # at T+0, cron fires at T+5 (dashboard still shows no worker
          # because heartbeat hasn't fired yet → needs_worker=true → push
          # → cancel current → new boot starts → repeat forever). The
          # user reports "wake never works" while GH Actions shows
          # successful dispatches every 5 min.
          #
          # Check current kernel status. If it's RUNNING or QUEUED, a
          # boot is already in flight — skip this push. Manual
          # workflow_dispatch (from the dashboard's Wake button) still
          # respects this to avoid double-pushes; user can click Stop
          # in Kaggle UI + re-wake to force a fresh cycle.
          STATUS=$(kaggle kernels status "$KAGGLE_USERNAME/yt-agent-worker" 2>/dev/null | grep -oE 'KernelWorkerStatus\.[A-Z_]+' | cut -d. -f2 || echo "UNKNOWN")
          echo "current kernel status: $STATUS"
          case "$STATUS" in
            RUNNING|QUEUED|CANCEL_REQUESTED)
              echo "::notice::Kernel is $STATUS — boot in progress. Skipping push to avoid cancelling in-flight boot. Cron will re-check in 5 min; manual dispatch may need to wait for the current boot to finish or fail."
              exit 0
              ;;
            *)
              echo "kernel status $STATUS — safe to push a fresh version."
              ;;
          esac
          # CPU BY DEFAULT (2026-08-20). Nothing in the pipeline runs a
          # local model on Kaggle any more — image generation, TTS and
          # the klein-4B stack are all API-backed, so the kernel's real
          # job is ffmpeg plus outbound HTTP. Booting a T4 for that
          # spends the 30 GPU-hr/week budget on an accelerator nothing
          # touches, and that budget is the binding constraint: it ran
          # to ~18 minutes remaining, while CPU sessions draw on a
          # separate and far larger quota.
          #
          # `--accelerator` OVERRIDES the metadata boolean (per the
          # Kaggle API docs for the acc parameter), so the two must
          # agree: pass the flag only when a GPU is actually wanted, and
          # set enable_gpu to match either way.
          #
          # The GPU path is kept intact, not deleted — pass
          # accelerator=NvidiaTeslaT4 on a manual dispatch to get the
          # old behaviour back verbatim. That value stays CRITICAL when
          # used: without it Kaggle defaults to P100 (sm_6.0), which
          # modern PyTorch has no kernels for, and the notebook's
          # gpu-guard then forces CPU anyway.
          # Exported, not just assigned — the heredoc below reads it from
          # the environment, and a bare shell variable would arrive as
          # None there, quietly forcing CPU even on a GPU dispatch.
          export ACC="${{ inputs.accelerator }}"
          python3 - <<'PY'
          import json, os
          p = 'kaggle/kernel-metadata.json'
          m = json.load(open(p))
          m['enable_gpu'] = 'true' if os.environ.get('ACC') else 'false'
          json.dump(m, open(p, 'w'), indent=2)
          print('enable_gpu =', m['enable_gpu'])
          PY
          if [ -n "$ACC" ]; then
            kaggle kernels push -p kaggle/ --accelerator "$ACC"
            echo "::notice::Kaggle worker dispatched on $ACC. Watch progress at https://www.kaggle.com/$KAGGLE_USERNAME/code"
          else
            kaggle kernels push -p kaggle/
            echo "::notice::Kaggle worker dispatched on CPU (no GPU quota spent). Watch progress at https://www.kaggle.com/$KAGGLE_USERNAME/code"
          fi
